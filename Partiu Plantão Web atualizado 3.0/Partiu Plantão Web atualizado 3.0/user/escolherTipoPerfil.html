<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiu Plantão</title>

    <!-- Ícone da aba do navegador -->

    <!-- Folha de estilos principal -->
    <link rel="stylesheet" href="../css/style.css">

<body class="pp-pagina">
    <div class="pp-card">

        <div class="pp-header">
            <div class="pp-logo-slot">

            <p class="pp-subtitulo">Encontre seu próximo plantão</p>

        <div class="pp-body">
            <p class="pp-label">Qual é o seu perfil?</p>

            <div class="pp-botoes">

                <a class="pp-btn" href="loginMedico.html">
                    <div class="pp-btn-icone">
                        <img src="../img/iconeMedico.png" alt="iconeMedico">

                    <div class="pp-btn-texto">

                    <div class="pp-btn-seta" aria-hidden="true">

                    </div>

                        <span>Gerencie os plantões da sua instituição</span>

                    <div class="pp-btn-seta" aria-hidden="true">

            </div>
        </div>
