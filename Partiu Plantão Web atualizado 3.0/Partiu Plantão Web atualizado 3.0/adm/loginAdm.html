<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partiu Plantão</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../img/Logotipo Partiu Plantão.jpg" type="image/png">
</head>

<body class="pp-pagina">
    <div class="pp-card">

        <div class="pp-header">
            <div class="pp-logo-slot">
                <img src="../img/Logotipo Partiu Plantão.jpg" alt="logo">
            </div>
            <h1 class="pp-titulo">Partiu Plantão</h1>
            <p class="pp-subtitulo">Disponibilize seu proximo plantão</p>
        </div>

        <div class="pp-body">
            <form action="homeAdmin.html">

                <div class="pp-form-group">
                    <input class="pp-input" placeholder="Email" type="email" required>
                </div>

                <div class="pp-form-group">
                    <input class="pp-input" placeholder="Senha" type="password" required>
                </div>

                <div class="pp-esqueci">
                    <a href="#">Esqueci minha senha</a>
                </div>

                <button type="submit" class="pp-btn-entrar">
                    Entrar
                </button>

                <p class="pp-rodape">
                    Não tem conta?
                    <a href="registroAdm.html"><b>Registre-se</b></a>
                </p>

            </form>
        </div>

    </div>

    <button class="botaoVoltar" onclick="window.history.back()">Voltar</button>

</body>
</html>
